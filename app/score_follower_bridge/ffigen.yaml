# Configuration for `dart run ffigen` (a dev_dependency of this package;
# see pubspec.yaml). Regenerates lib/src/score_follower_bindings.dart
# directly from ../../core-dsp/include/ScoreFollowerCApi.h.
#
# The checked-in bindings file was authored by hand against exactly this
# configuration, because neither the Dart SDK nor ffigen were available in
# the environment this package was originally scaffolded in (see that
# file's own header comment for details). Run `dart run ffigen` once a real
# Dart/Flutter toolchain is available, both to confirm the hand-written
# bindings still match the C header bit-for-bit, and to pick up any future
# ScoreFollowerCApi.h changes automatically from then on.
name: ScoreFollowerBindings
description: >
  Dart FFI bindings for score_follower_core's plain-C ABI
  (ScoreFollowerCApi.h), generated as @Native external functions resolved
  against the code asset produced by hook/build.dart.
output: 'lib/src/score_follower_bindings.dart'

headers:
  entry-points:
    - '../../core-dsp/include/ScoreFollowerCApi.h'

compiler-opts:
  - '-I../../core-dsp/include'

# Generate @Native external functions/asset-linked bindings instead of the
# older DynamicLibrary.lookup style; the asset-id below must match the
# asset name hook/build.dart registers via findAndAddCodeAssets for the
# same library URI.
ffi-native:
  asset-id: 'package:score_follower_bridge/src/score_follower_bindings.dart'

comments:
  style: any
  length: full

preamble: |
  // Generated by `dart run ffigen` from core-dsp/include/ScoreFollowerCApi.h.
  // Do not edit by hand; edit ScoreFollowerCApi.h and re-run ffigen instead.
