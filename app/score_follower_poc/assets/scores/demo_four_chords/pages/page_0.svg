<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#FAF8F4"/>
  <text x="48" y="56" font-family="Georgia, serif" font-size="28" fill="#1A1A1A">Demo: C - G - Am - F</text>
  <text x="48" y="88" font-family="Georgia, serif" font-size="14" fill="#555555">Phase 5.2 timeline-mapped reference (50 frames per chord)</text>

  <!-- Staff -->
  <g stroke="#222222" stroke-width="2" fill="none">
    <line x1="48" y1="180" x2="912" y2="180"/>
    <line x1="48" y1="200" x2="912" y2="200"/>
    <line x1="48" y1="220" x2="912" y2="220"/>
    <line x1="48" y1="240" x2="912" y2="240"/>
    <line x1="48" y1="260" x2="912" y2="260"/>
  </g>

  <!-- Treble clef stand-in -->
  <text x="56" y="248" font-family="Georgia, serif" font-size="48" fill="#222222">G</text>

  <!-- Chord labels at xNorm 0.12, 0.34, 0.56, 0.78 -->
  <g font-family="Georgia, serif" font-size="22" fill="#1A1A1A" text-anchor="middle">
    <text x="115" y="320">C</text>
    <text x="326" y="320">G</text>
    <text x="538" y="320">Am</text>
    <text x="749" y="320">F</text>
  </g>

  <!-- Whole-note stand-ins on the staff -->
  <g fill="#222222">
    <ellipse cx="115" cy="220" rx="14" ry="10"/>
    <ellipse cx="326" cy="200" rx="14" ry="10"/>
    <ellipse cx="538" cy="230" rx="14" ry="10"/>
    <ellipse cx="749" cy="240" rx="14" ry="10"/>
  </g>

  <!-- Measure bars -->
  <g stroke="#222222" stroke-width="2">
    <line x1="220" y1="180" x2="220" y2="260"/>
    <line x1="432" y1="180" x2="432" y2="260"/>
    <line x1="643" y1="180" x2="643" y2="260"/>
    <line x1="855" y1="180" x2="855" y2="260"/>
    <line x1="912" y1="180" x2="912" y2="260" stroke-width="4"/>
  </g>
</svg>
