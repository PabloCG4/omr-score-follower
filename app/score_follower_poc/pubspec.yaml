name: score_follower_poc
description: >
  Phase 5.2 Flutter PoC: captures microphone audio, drives
  score_follower_core through score_follower_bridge, and maps the tracked
  reference frame index onto a score page with a smoothly interpolated cursor.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  score_follower_bridge:
    path: ../score_follower_bridge
  record: any
  android_libcpp_shared: any
  flutter_svg: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/scores/demo_four_chords/manifest.json
    - assets/scores/demo_four_chords/timeline_map.json
    - assets/scores/demo_four_chords/reference_chromagram.f32
    - assets/scores/demo_four_chords/pages/page_0.svg
