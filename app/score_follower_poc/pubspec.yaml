name: score_follower_poc
description: >
  Phase 5 Flutter PoC: offline local persistence, microphone capture through
  score_follower_bridge, and score-following UI with practice modes.
publish_to: none
version: 0.3.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  score_follower_bridge:
    path: ../score_follower_bridge
  record: any
  android_libcpp_shared: any
  flutter_svg: any
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  http: ^1.2.0
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  drift_dev: ^2.28.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/scores/demo_four_chords/manifest.json
    - assets/scores/demo_four_chords/timeline_map.json
    - assets/scores/demo_four_chords/reference_chromagram.f32
    - assets/scores/demo_four_chords/pages/page_0.svg
