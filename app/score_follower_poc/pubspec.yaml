name: score_follower_poc
description: >
  Phase 5.1 proof-of-concept Flutter app: captures microphone audio, drives
  score_follower_core's Online DTW alignment engine through
  score_follower_bridge, and renders the raw tracked reference frame index
  and confidence as they update in real time. Deliberately not a score
  renderer or page-turn UI; see TECHNICAL_CHANGELOG.md and
  ../score_follower_bridge/README.md.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  score_follower_bridge:
    path: ../score_follower_bridge
  # Low-latency, cross-platform raw-PCM microphone streaming (see
  # AudioRecorder.startStream in lib/main.dart). Left unpinned; see
  # ../score_follower_bridge/pubspec.yaml's own comment on why toolchain
  # package versions are not guessed in this scaffold.
  record: any
  # Bundles the matching libc++_shared.so for each target Android ABI from
  # the installed NDK. score_follower_core links the C++ standard library,
  # so without this dependency dlopen would silently fail on a real Android
  # device only (never surfaced by a desktop smoke test).
  android_libcpp_shared: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
